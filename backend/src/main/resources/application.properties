server.address=127.0.0.1
server.port=8081
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:54329/checkout}
spring.datasource.username=${DATABASE_USER:checkout}
spring.datasource.password=${DATABASE_PASSWORD:local-checkout}
spring.datasource.hikari.maximum-pool-size=12
spring.jackson.deserialization.fail-on-unknown-properties=true
app.webhook-secret=${WEBHOOK_SECRET:local-demo-signing-secret-not-for-production}
app.demo-enabled=${DEMO_ENABLED:true}
app.callback-url=${CALLBACK_URL:http://localhost:8081/webhooks/payment}
server.error.include-message=never
