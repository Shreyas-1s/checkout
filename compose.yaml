services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: local-checkout
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["checkout-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  checkout-data:
